name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path ocr-helper/Cargo.toml --check
      - run: ./build.ps1
      - run: cargo test --release --locked
      - run: ./target/release/instascanspeak-cli.exe --validate-hotkey Ctrl+Alt+S
      - run: python tests/hotkey-config.py
      - run: ./tests/rebrand.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: instascanspeak-windows-x64
          path: dist/windows-x64/*
