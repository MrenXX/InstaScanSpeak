name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path ocr-helper/Cargo.toml --check
      - run: cargo build --release --locked
      - run: cargo build --manifest-path ocr-helper/Cargo.toml --release --locked
      - run: cargo test --release --locked
      - run: ./target/release/instaspeak-cli.exe --validate-hotkey Ctrl+Alt+S
      - uses: actions/upload-artifact@v4
        with:
          name: instaspeak-windows-x64
          path: |
            target/release/*.exe
            ocr-helper/target/release/instaspeak-ocr.exe
