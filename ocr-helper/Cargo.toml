[package]
name = "instaspeak-ocr"
version = "0.5.0"
edition = "2024"

[dependencies]
oar-ocr-core = { version = "=0.10.0", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
image = { version = "0.25", default-features = false }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
